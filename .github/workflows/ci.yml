name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q evals eval_runner tests
      - name: Validate manifests
        run: marketing-benchmark validate
      - name: Validate direct-model eval manifests
        run: python -m eval_runner.bench validate
      - name: Check plugin conformance
        run: marketing-benchmark conformance
      - name: Check private boundary
        run: python scripts/export-eval-runner.py --check
      - name: Test
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
